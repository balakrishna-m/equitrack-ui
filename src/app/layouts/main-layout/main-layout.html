<mat-toolbar>
  <a class="brand" routerLink="/dashboard">EquiTrack</a>

  <span class="toolbar-spacer"></span>

  <button
    mat-icon-button
    type="button"
    class="profile-button"
    aria-label="Open profile menu"
    [matMenuTriggerFor]="profileMenu"
  >
    <span class="profile-initials" aria-hidden="true">ET</span>
  </button>

  <mat-menu #profileMenu="matMenu" xPosition="before">
    <div class="profile-summary">
      <strong>EquiTrack User</strong>
      <span>Manage your account</span>
    </div>
    <a mat-menu-item routerLink="/settings">Settings</a>
    <button mat-menu-item type="button" (click)="logout()">Log out</button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard"> Dashboard </a>

      <a mat-list-item routerLink="/portfolio"> Portfolio </a>

      <a mat-list-item routerLink="/watchlist"> Watchlist </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
